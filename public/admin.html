<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Aprovar depoimentos | World Brilho</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/service-photos.css"></head><body class="admin-page"><main class="admin-shell"><h1>Aprovar depoimentos</h1><p>Digite sua senha administrativa para visualizar e publicar avaliações.</p><form id="login" class="testimonial-form"><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><button class="button">Entrar</button></form><p id="status" role="status"></p><div id="reviews" class="admin-reviews"></div></main><script>
const login=document.querySelector('#login'),reviews=document.querySelector('#reviews'),statusEl=document.querySelector('#status');let password='';
async function load(){const r=await fetch('/api/admin/testimonials',{headers:{'x-admin-password':password}});if(!r.ok){statusEl.textContent='Senha incorreta.';return;}statusEl.textContent='';const items=await r.json();reviews.replaceChildren(...items.map(item=>{const card=document.createElement('article');const name=document.createElement('h2');name.textContent=item.name;const service=document.createElement('small');service.textContent=item.service;const message=document.createElement('p');message.textContent=item.message;const button=document.createElement('button');button.className='button button-small';button.textContent=item.approved?'Retirar da página':'Aprovar e publicar';button.onclick=async()=>{await fetch('/api/admin/testimonials/'+item.id,{method:'PATCH',headers:{'content-type':'application/json','x-admin-password':password},body:JSON.stringify({approved:!item.approved})});load();};card.append(name,service,message,button);return card;}));if(!items.length)statusEl.textContent='Nenhum depoimento recebido ainda.';}
login.addEventListener('submit',e=>{e.preventDefault();password=new FormData(login).get('password');load();});
</script></body></html>
